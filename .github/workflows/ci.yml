name: ci

# Offline checks only: no API key is configured, so the tests run the graph with a
# scripted model and never call OpenAI or LangSmith.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uvx ruff@0.16.9 check .
      - run: uv run pytest -q
